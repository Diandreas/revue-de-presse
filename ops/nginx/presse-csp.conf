# Revue de Presse — Content-Security-Policy de l'application React (contexte « server » ou
# « location »).
#
# Installation : /etc/nginx/snippets/presse/presse-csp.conf. Inclus par presse-hardening.conf
# au niveau server, et à ré-inclure dans `location = /index.html` (qui déclare son propre
# Cache-Control et n'hérite donc plus des add_header du server).
#
# Scripts et styles servis par le site, polices Google Fonts, aperçus locaux des photos en
# blob:. Compatible avec l'admin Django.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
