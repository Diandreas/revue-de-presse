# Revue de Presse — en-têtes de sécurité communs (contexte « server » ou « location »).
#
# Installation : /etc/nginx/snippets/presse/presse-security-headers.conf, inclus par
# presse-hardening.conf au niveau server. Rappel nginx : un bloc location qui déclare son
# propre add_header n'hérite plus de ceux du server -> il doit ré-inclure ce fichier.

# HTTPS imposé pendant 1 an (y compris les sous-domaines de presse.mirlab.cloud).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# La prise de photo passe par <input capture> (appareil photo natif) : aucune API sensible.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Django envoie déjà certains de ces en-têtes : on ne garde que ceux de nginx (évite les
# doublons contradictoires, ex. deux Referrer-Policy différents).
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
