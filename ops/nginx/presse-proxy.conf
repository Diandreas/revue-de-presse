# Revue de Presse — transmission vers gunicorn (contexte « location »).
#
# Installation : /etc/nginx/snippets/presse/presse-proxy.conf. Reprend les réglages du
# bloc `location /api/` existant du vhost : les aligner s'ils diffèrent (port, timeouts).
# X-Forwarded-For est COMPLÉTÉ par nginx ($proxy_add_x_forwarded_for) : Django en lit la
# dernière adresse (DJANGO_NUM_PROXIES=1), celle que nginx a vue, donc non falsifiable.

proxy_pass http://127.0.0.1:8097;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
client_max_body_size 32m;
proxy_read_timeout 120s;
