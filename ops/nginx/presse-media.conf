# Revue de Presse — fichiers clients privés (contexte « server »).
#
# Les documents déposés, exports et justificatifs ne sont plus servis en accès libre :
# l'API renvoie des liens signés /api/media/<échéance>/<signature>/<chemin> ; Django
# vérifie la signature puis répond « X-Accel-Redirect: /protected-media/<chemin> », et
# nginx envoie alors le fichier depuis l'emplacement « internal » ci-dessous (inaccessible
# depuis l'extérieur). Côté Django : MEDIA_X_ACCEL_REDIRECT=True (défaut de config.settings.prod).
#
# Installation (CloudPanel > Sites > presse.mirlab.cloud > Vhost, bloc server HTTPS) :
#   1. SUPPRIMER du vhost le bloc existant `location /media/ { alias … }` (remplacé
#      ci-dessous ; nginx refuse deux blocs pour le même chemin).
#   2. Vérifier que l'alias correspond à MEDIA_ROOT (backend/mediafiles), slash final compris.
#   3. Ajouter dans le bloc server : include /etc/nginx/snippets/presse/presse-media.conf;
#   4. nginx -t && systemctl reload nginx

# Ancien accès direct : fermé (un lien /media/ divulgué ne donne plus rien).
location ^~ /media/ {
    return 404;
}

location ^~ /protected-media/ {
    internal;
    alias /home/mirlab-presse/htdocs/presse.mirlab.cloud/backend/mediafiles/;

    # Type déduit de l'extension, imposée au dépôt d'après le contenu réel du fichier.
    types {
        application/pdf pdf;
        image/jpeg jpg jpeg;
        image/png png;
        image/webp webp;
        image/heic heic;
        image/heif heif;
        image/gif gif;
        image/bmp bmp;
        image/tiff tif tiff;
        application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
    }
    default_type application/octet-stream;

    # nginx ne reprend pas les en-têtes de sécurité de la réponse Django lors d'un
    # X-Accel-Redirect (seuls Content-Type, Content-Disposition et Cache-Control passent) :
    # on les repose ici. Le document est isolé (sandbox) : même un fichier piégé ne peut
    # exécuter aucun script ni lire les cookies du site.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
}
