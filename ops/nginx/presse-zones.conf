# Revue de Presse — zones de limitation de débit (contexte « http » de nginx).
#
# Installation : copier dans /etc/nginx/conf.d/presse-zones.conf (ce dossier est inclus
# dans le bloc http {} de /etc/nginx/nginx.conf ; vérifier avec `nginx -T | grep conf.d`).
# Utilisées par presse-hardening.conf. Django applique en plus ses propres limites, plus
# fines (par compte, par e-mail, par route : cf. backend/apps/core/throttling.py) ; nginx
# sert de première barrière et soulage gunicorn lors d'une rafale.
#
# Si le site passe un jour derrière Cloudflare (ou un autre CDN), $binary_remote_addr
# serait l'IP du CDN : configurer d'abord le module realip (set_real_ip_from + real_ip_header).

# Connexion et inscription : ~10 requêtes/minute par IP (rafale absorbée par « burst »).
limit_req_zone $binary_remote_addr zone=presse_login:10m rate=10r/m;
# Reste de /api/auth/ (reprise de session à chaque chargement, invitations…).
limit_req_zone $binary_remote_addr zone=presse_auth:10m rate=30r/m;
# Page de connexion de l'administration Django.
limit_req_zone $binary_remote_addr zone=presse_admin:10m rate=10r/m;
