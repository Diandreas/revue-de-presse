# Revue de Presse — durcissement du vhost presse.mirlab.cloud (contexte « server »).
#
# Prérequis : presse-zones.conf installé (contexte http), puis dans
# /etc/nginx/snippets/presse/ : presse-security-headers.conf, presse-csp.conf et presse-proxy.conf.
#
# Rappel : les blocs location du vhost qui ont leur propre add_header (`/assets/`,
# `= /index.html`) n'héritent plus de ces en-têtes : y ajouter
#   include /etc/nginx/snippets/presse/presse-security-headers.conf;
#   include /etc/nginx/snippets/presse/presse-csp.conf;   (pour = /index.html)
#
# Installation (CloudPanel > Sites > presse.mirlab.cloud > Vhost, bloc server HTTPS) :
#   1. Remplacer __ADMIN_PATH__ ci-dessous par la valeur de DJANGO_ADMIN_URL du .env, sans
#      les « / » (ex. gestion-7f3k9q) :
#        sed -i 's/__ADMIN_PATH__/gestion-7f3k9q/g' /etc/nginx/snippets/presse/presse-hardening.conf
#   2. SUPPRIMER du vhost le bloc existant `location /admin/ { … }` (remplacé ci-dessous ;
#      nginx refuse deux blocs pour le même chemin).
#   3. Ajouter dans le bloc server : include /etc/nginx/snippets/presse/presse-hardening.conf;
#   4. nginx -t && systemctl reload nginx
#
# Les blocs « = » et « ^~ » ci-dessous l'emportent sur le `location /api/` existant, qui
# continue de servir le reste de l'API.

# --- En-têtes de sécurité sur toutes les réponses -----------------------------------------
include /etc/nginx/snippets/presse/presse-security-headers.conf;

# CSP de l'application React (cf. presse-csp.conf).
include /etc/nginx/snippets/presse/presse-csp.conf;

limit_req_status 429;

# --- Connexion, inscription : limite stricte par IP ---------------------------------------
location = /api/auth/token/ {
    limit_req zone=presse_login burst=10 nodelay;
    include /etc/nginx/snippets/presse/presse-proxy.conf;
}

location = /api/auth/register/ {
    limit_req zone=presse_login burst=5 nodelay;
    include /etc/nginx/snippets/presse/presse-proxy.conf;
}

# --- Reste de l'authentification (reprise de session, invitations…) ----------------------
location ^~ /api/auth/ {
    limit_req zone=presse_auth burst=30 nodelay;
    include /etc/nginx/snippets/presse/presse-proxy.conf;
}

# --- Administration Django sur son chemin secret (DJANGO_ADMIN_URL) -----------------------
location = /__ADMIN_PATH__/login/ {
    limit_req zone=presse_admin burst=5 nodelay;
    # Optionnel : n'autoriser que les IP de l'équipe (si elles sont fixes).
    # allow 203.0.113.10;
    # deny all;
    include /etc/nginx/snippets/presse/presse-proxy.conf;
}

location ^~ /__ADMIN_PATH__/ {
    # allow 203.0.113.10;
    # deny all;
    include /etc/nginx/snippets/presse/presse-proxy.conf;
}

# Ancien chemin : plus rien à y trouver (à retirer si DJANGO_ADMIN_URL reste « admin/ »).
location ^~ /admin/ {
    return 404;
}

# --- Documentation de l'API (staff uniquement, cf. SERVE_PERMISSIONS) ----------------------
# Swagger UI charge ses scripts depuis cdn.jsdelivr.net avec un script en ligne : CSP
# assouplie sur cette seule page.
location = /api/docs/ {
    include /etc/nginx/snippets/presse/presse-security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'none'" always;
    include /etc/nginx/snippets/presse/presse-proxy.conf;
}
